# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pharmacy-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PORT
        value: 5000